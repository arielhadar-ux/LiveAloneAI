# Render Blueprint for a COPY of LiveAlone AI: one web service, no new database.
# Render's free plan allows only one free database, so this copy asks you for DATABASE_URL instead.
# Paste either a free Neon/Supabase Postgres URL (separate data) or your existing database's URL (shared data).
services:
  - type: web
    name: livealone-ai-2
    runtime: node
    plan: free
    buildCommand: node unpack.mjs && npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: AI_PROVIDER
        sync: false
      - key: ALLOW_SENSITIVE_ON_FREE
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: TMDB_API_KEY
        sync: false
      - key: PEXELS_API_KEY
        sync: false
      - key: CONTACT_EMAIL
        sync: false
